name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: sdkmanager --install 'platforms;android-34' 'build-tools;34.0.0'
      - name: Build APK and Wi-Fi initializer
        run: ./gradlew --no-daemon :app:assembleRelease :app:assembleWifiBootstrap
      - name: Verify and stage artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/XingyuHelper.apk
          cp app/build/outputs/bootstrap/XingyuWifiBootstrap.jar dist/XingyuWifiBootstrap.jar
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose dist/XingyuHelper.apk
          unzip -Z -1 dist/XingyuWifiBootstrap.jar | grep -Fx classes.dex
          cd dist
          sha256sum XingyuHelper.apk XingyuWifiBootstrap.jar > SHA256SUMS
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: XingyuHelper-Android
          path: dist/
          if-no-files-found: error
          retention-days: 14
